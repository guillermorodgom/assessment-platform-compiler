# Copiar a .github/workflows/ci.yml en cada repo backend (auth, mngr, compiler)
name: CI - Backend

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      - name: Compile
        run: mvn compile -DskipTests -q

  trigger-deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy in infra
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.DEPLOY_TOKEN }}" \
            https://api.github.com/repos/guillermorodgom/assessment-platform-infra/dispatches \
            -d '{"event_type":"deploy","client_payload":{"repo":"${{ github.repository }}"}}'
